<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111119"/>
      <stop offset="1" stop-color="#08080b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#d9a441" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d9a441" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shell" cx="0.38" cy="0.30" r="0.85">
      <stop stop-color="#f6d492"/>
      <stop offset="0.45" stop-color="#e6b45a"/>
      <stop offset="1" stop-color="#b07d2c"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="250" cy="315" rx="520" ry="420" fill="url(#glow)"/>

  <!-- cowrie mark -->
  <g transform="translate(96 232) scale(3.7)">
    <ellipse cx="0" cy="0" rx="14.5" ry="19" fill="url(#shell)"/>
    <ellipse cx="-4.5" cy="-8.5" rx="6.5" ry="8.5" fill="#fff2d4" opacity="0.32"/>
    <path d="M0 -17 C3.2 -10.5 3.2 10.5 0 17 C-3.2 10.5 -3.2 -10.5 0 -17 Z" fill="#0c0a08" opacity="0.9"/>
    <g stroke="#e6b45a" stroke-width="1.4" stroke-linecap="round" opacity="0.9">
      <line x1="-2" y1="-8.5" x2="-5.5" y2="-9.3"/>
      <line x1="-2.4" y1="-3.5" x2="-6.4" y2="-3.9"/>
      <line x1="-2.5" y1="1.5" x2="-6.6" y2="1.5"/>
      <line x1="-2.4" y1="6.5" x2="-6.2" y2="6.9"/>
      <line x1="2" y1="-8.5" x2="5.5" y2="-9.3"/>
      <line x1="2.4" y1="-3.5" x2="6.4" y2="-3.9"/>
      <line x1="2.5" y1="1.5" x2="6.6" y2="1.5"/>
      <line x1="2.4" y1="6.5" x2="6.2" y2="6.9"/>
    </g>
  </g>

  <!-- wordmark + tagline -->
  <text x="330" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="118" font-weight="600" letter-spacing="14" fill="#e8e4da">MKOBA</text>
  <text x="334" y="330" font-family="Georgia, serif" font-size="40" font-style="italic" fill="#f0c87a">Money has always moved.</text>
  <text x="334" y="386" font-family="Georgia, serif" font-size="40" font-style="italic" fill="#f0c87a">Now it moves with you.</text>
  <text x="336" y="452" font-family="ui-monospace, 'Courier New', monospace" font-size="21" letter-spacing="6" fill="#7fd1d4">A KENYAN HISTORY OF MONEY · 1780 — 2026</text>

  <!-- era timeline -->
  <g transform="translate(336 500)">
    <line x1="0" y1="0" x2="760" y2="0" stroke="#a39e92" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="0" y1="0" x2="760" y2="0" stroke="#d9a441" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="2 148"/>
    <g font-family="ui-monospace, monospace" font-size="15" letter-spacing="3" fill="#a39e92">
      <text x="0" y="30">BARTER</text>
      <text x="150" y="30">COIN</text>
      <text x="270" y="30">PAPER</text>
      <text x="400" y="30">PLASTIC</text>
      <text x="540" y="30">MOBILE</text>
      <text x="680" y="30">CRYPTO</text>
    </g>
    <g fill="#d9a441">
      <circle cx="0" cy="0" r="3.2"/><circle cx="150" cy="0" r="3.2"/><circle cx="270" cy="0" r="3.2"/>
      <circle cx="400" cy="0" r="3.2"/><circle cx="540" cy="0" r="3.2"/><circle cx="700" cy="0" r="4.2"/>
    </g>
  </g>
</svg>
