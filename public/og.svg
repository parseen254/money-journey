<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0e0e15"/>
      <stop offset="1" stop-color="#070709"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.52" r="0.5">
      <stop stop-color="#d9a441" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#d9a441" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect x="70" y="115" width="400" height="400" rx="28"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="300" cy="330" rx="460" ry="380" fill="url(#glow)"/>

  <!-- Nano Banana gold cowrie emblem -->
  <image xlink:href="og-emblem.png" x="70" y="115" width="400" height="400" clip-path="url(#round)" preserveAspectRatio="xMidYMid slice"/>

  <!-- wordmark + tagline -->
  <text x="512" y="248" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="600" letter-spacing="12" fill="#e8e4da">MKOBA</text>
  <text x="516" y="322" font-family="Georgia, serif" font-size="38" font-style="italic" fill="#f0c87a">Money has always moved.</text>
  <text x="516" y="374" font-family="Georgia, serif" font-size="38" font-style="italic" fill="#f0c87a">Now it moves with you.</text>
  <text x="518" y="438" font-family="ui-monospace, 'Courier New', monospace" font-size="19" letter-spacing="5" fill="#7fd1d4">A KENYAN HISTORY OF MONEY · 1780 — 2026</text>

  <!-- era timeline -->
  <g transform="translate(518 486)">
    <line x1="0" y1="0" x2="620" y2="0" stroke="#a39e92" stroke-opacity="0.3" stroke-width="1"/>
    <g font-family="ui-monospace, monospace" font-size="14" letter-spacing="2.5" fill="#a39e92">
      <text x="0" y="28">BARTER</text>
      <text x="122" y="28">COIN</text>
      <text x="220" y="28">PAPER</text>
      <text x="328" y="28">PLASTIC</text>
      <text x="442" y="28">MOBILE</text>
      <text x="556" y="28">CRYPTO</text>
    </g>
    <g fill="#d9a441">
      <circle cx="0" cy="0" r="3"/><circle cx="122" cy="0" r="3"/><circle cx="220" cy="0" r="3"/>
      <circle cx="328" cy="0" r="3"/><circle cx="442" cy="0" r="3"/><circle cx="572" cy="0" r="4.4"/>
    </g>
  </g>
</svg>
